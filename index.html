<!doctype html>
<html lang="en" data-theme="win98">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="theme-color" content="#008080" />

    <title>Digital CV</title>
    <!--
      The real title is set at runtime from cv.json, so it follows whoever's CV
      is published. These baked-in tags stay generic on purpose: they are only
      what a crawler sees before the app boots.
    -->
    <meta name="description" content="Interactive digital CV presented as a retro Windows desktop." />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Digital CV" />
    <meta
      property="og:description"
      content="Interactive digital CV presented as a retro Windows desktop."
    />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      This site is an interactive desktop and requires JavaScript. A plain PDF
      version of the CV is available at <a href="./CV_EN.pdf">CV_EN.pdf</a>.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
